[workspace]
# wgpu requires the newer resolver
resolver = "2"
members = ["ssbh_wgpu", "ssbh_wgpu_viewer", "ssbh_wgpu_test", "nutexb_wgpu", "nutexb_wgpu_viewer"]

[workspace.dependencies]
ssbh_data = { git = "https://github.com/ultimate-research/ssbh_lib", rev = "188df7c" }
wgpu = "30.0.1"
glam = "0.34.3"
rayon = "1.8.1"
wgsl_to_wgpu = "0.19.1"
winit = "0.30.13"
anyhow = "1.0"
clap = "4.6.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3.0"
